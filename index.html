<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aderet</title>

<style>
/* ========================= */
/* RESET Y GENERALES */
/* ========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f7f1ed;
    color:#5e4b52;
    overflow-x:hidden;
}

/* ========================= */
/* MENU MOBILE */
/* ========================= */
.menu-mobile{
    position:fixed;
    top:15px;
    left:15px;
    width:55px;
    height:55px;
    background:#8a5d6b;
    color:white;
    border-radius:15px;
    display:none;
    justify-content:center;
    align-items:center;
    font-size:30px;
    cursor:pointer;
    z-index:9999;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

/* ========================= */
/* SIDEBAR */
/* ========================= */
.sidebar{
    width:260px;
    height:100vh;
    background:#ead5cf;
    position:fixed;
    left:0;
    top:0;
    padding:110px 25px 40px;
    overflow-y:auto;
    box-shadow:5px 0px 20px rgba(0,0,0,0.05);
    transition:0.4s;
    z-index:999;
}

.logo-menu{
    font-size:42px;
    font-weight:bold;
    color:#8a5d6b;
    margin-bottom:50px;
}

.menu-item{
    font-size:20px;
    margin-bottom:22px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.menu-item:hover{
    color:#8a5d6b;
    transform:translateX(5px);
}

.submenu{
    margin-left:15px;
    margin-top:10px;
    display:none;
}

.submenu div{
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}

.submenu div:hover{
    color:#8a5d6b;
    transform:translateX(5px);
}

/* ========================= */
/* CONTENIDO Y PAGINAS */
/* ========================= */
.contenido{
    margin-left:260px;
    width:calc(100% - 260px);
}

.pagina{
    min-height:100vh;
    padding:60px;
    display:none;
}

.activa{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* ========================= */
/* INICIO */
/* ========================= */
.logo{
    width:260px;
    height:260px;
    border-radius:30px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:40px;
    box-shadow:0px 5px 20px rgba(0,0,0,0.08);
    font-size:25px;
    color:#999;
    overflow:hidden;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

#inicio h2{
    font-size:65px;
    color:#8a5d6b;
    margin-bottom:20px;
}

#inicio p{
    font-size:22px;
    max-width:700px;
    line-height:35px;
}

/* ========================= */
/* TITULOS Y GRILLA */
/* ========================= */
.titulo{
    font-size:50px;
    color:#8a5d6b;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:22px;
}

.producto{
    background:white;
    border-radius:22px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0px 5px 15px rgba(0,0,0,0.08);
}

.producto:hover{
    transform:translateY(-8px) scale(1.02);
}

.producto img{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
}

.info{
    padding:18px;
}

.info h3{
    color:#8a5d6b;
    font-size:18px;
}

/* ========================= */
/* DETALLE DE PRODUCTO */
/* ========================= */
.producto-container{
    display:flex;
    gap:50px;
}

.galeria{
    width:50%;
}

.imagen-principal{
    width:100%;
    height:650px;
    background:white;
    border-radius:25px;
    overflow:hidden;
}

.imagen-principal img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.producto-info{
    width:50%;
}

.producto-info h1{
    font-size:45px;
    color:#8a5d6b;
    margin-bottom:20px;
    text-align: left;
}

.descripcion{
    line-height:32px;
    font-size:18px;
    margin-bottom:25px;
    text-align: left;
}

.subtitulo{
    font-size:24px;
    color:#8a5d6b;
    margin-top:30px;
    margin-bottom:15px;
    text-align: left;
}

/* ========================= */
/* TALLES Y COLORES */
/* ========================= */
.talles{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.talle{
    padding:12px 18px;
    background:white;
    border:2px solid #d6b9c3;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.talle:hover{
    background:#8a5d6b;
    color:white;
}

.talle.activo{
    background:#8a5d6b;
    color:white;
}

.colores{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.color{
    width:42px;
    height:42px;
    border-radius:50%;
    border:2px solid #ddd;
    cursor:pointer;
    transition:0.3s;
}

.color:hover{
    transform:scale(1.12);
}

.color.activo{
    border:4px solid #8a5d6b;
    transform:scale(1.15);
}

/* ========================= */
/* BOTONES */
/* ========================= */
.btn{
    display:inline-block;
    margin-top:35px;
    background:#8a5d6b;
    color:white;
    padding:18px 40px;
    border-radius:15px;
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.btn-volver{
    display:inline-block;
    margin-bottom:25px;
    background:#ead5cf;
    color:#8a5d6b;
    padding:12px 22px;
    border-radius:14px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
    float: left;
}

/* ========================= */
/* CONTACTO */
/* ========================= */
.contacto-container{
    width:100%;
    display:flex;
    justify-content:center;
}

.contacto-box{
    width:100%;
    max-width:650px;
    background:white;
    border-radius:35px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.contacto-box h2{
    font-size:52px;
    color:#9b6b7d;
    margin-bottom:35px;
}

.contacto-item{
    font-size:28px;
    margin-bottom:28px;
}

.contacto-item a{
    color:#9b6b7d;
    text-decoration:none;
    font-weight:bold;
}

/* ========================= */
/* RESPONSIVE */
/* ========================= */
@media(max-width:900px){
    .menu-mobile{
        display:flex;
    }
    .sidebar{
        left:-260px;
    }
    .sidebar.activo{
        left:0;
    }
    .contenido{
        margin-left:0;
        width:100%;
    }
    .pagina{
        padding:90px 15px 30px;
    }
    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }
    .producto-container{
        flex-direction:column;
        gap:30px;
    }
    .galeria,
    .producto-info{
        width:100%;
    }
    .imagen-principal{
        height:420px;
    }
    #inicio h2{
        font-size:42px;
    }
    .titulo{
        font-size:38px;
    }
}
</style>
</head>
<body>

<div class="menu-mobile" onclick="toggleMenu()">☰</div>

<div class="sidebar">
    <div class="logo-menu">Aderet</div>
    <div class="menu-item" onclick="mostrarPagina('inicio')">Inicio</div>
    <div class="menu-item" onclick="toggleProductos()">Productos</div>
    <div class="submenu" id="submenuProductos">
        <div onclick="mostrarPagina('sabanas')">Sábanas</div>
        <div onclick="mostrarPagina('mantas')">Mantas</div>
        <div onclick="mostrarPagina('peluches')">Peluches con manta</div>
        <div onclick="mostrarPagina('acolchados')">Acolchados</div>
        <div onclick="mostrarPagina('cobertores')">Cobertores</div>
        <div onclick="mostrarPagina('toallas')">Toallas</div>
    </div>
    <div class="menu-item" onclick="mostrarPagina('contacto')">Contacto</div>
</div>

<div class="contenido" id="contenedorPrincipal">

    <section class="pagina activa" id="inicio">
        <div class="logo">
            <img src="logo.png" alt="Logo Aderet">
        </div>
        <h2>Elegancia y confort</h2>
        <p>Blanquería online moderna y minimalista. Diseños delicados y calidad premium.</p>
    </section>

    <section class="pagina" id="contacto">
        <div class="contacto-container">
            <div class="contacto-box">
                <h2>Contacto</h2>
                <div class="contacto-item">
                    📱 WhatsApp<br>
                    <a href="https://wa.me/5491158203956" target="_blank">11 5820-3956</a>
                </div>
                <div class="contacto-item">
                    📸 Instagram<br>
                    <a href="https://instagram.com/aderet" target="_blank">@Aderet</a>
                </div>
            </div>
        </div>
    </section>

</div>

<script>
/* ========================= */
/* CONFIGURACIÓN DE DATOS */
/* ========================= */
const categorias = ["sabanas", "mantas", "peluches", "acolchados", "cobertores", "toallas"];

const nombresSabanas = {
    1:"Juego de Sábanas",
    2:"Sábana Torero",
    3:"Sábana 2 en 1 Torero & Casa Premium",
    4:"Sábana Diseño Americano",
    5:"Sábana Fusion"
};

const tallesSabanas = {
    1:[{nombre:"1½",precio:"25.000"}],
    2:[{nombre:"Twin",precio:"32.000"},{nombre:"Queen",precio:"34.000"},{nombre:"King",precio:"36.000"}],
    3:[{nombre:"Twin",precio:"28.000"},{nombre:"Full",precio:"30.000"},{nombre:"Queen",precio:"32.000"}],
    4:[{nombre:"Twin",precio:"24.000"},{nombre:"Full",precio:"26.000"},{nombre:"Queen",precio:"28.000"}],
    5:[{nombre:"Twin",precio:"22.000"},{nombre:"Full",precio:"24.000"},{nombre:"Queen",precio:"26.000"}]
};

const coloresSabanas = {
    1:["#4a6fdc","#f5a9c5",["#4a6fdc","#f5a9c5"]],
    2:["#c8a2ff","#f7b6c2","#808080","#ffd1dc","#001f5c","#002b7f","#ff1493","#f5e6cc","#0d1b4d","#000000","#d3d3d3","#c08081","#7b1e3a","#ffb6c1","#8b7d7b","#dcdcdc","#005eff","#e8d9b5","#3a3a3a","#d40000","#ff8c69",["#c8a2ff","#f7b6c2"],["#808080","#ffd1dc"],["#001f5c","#002b7f"],["#ff1493","#f5e6cc"],["#0d1b4d","#000000"],["#d3d3d3","#c08081"],["#7b1e3a","#ffb6c1"],["#8b7d7b","#dcdcdc"],["#005eff","#e8d9b5"],["#3a3a3a","#d40000"]],
    3:["#005eff",["#005eff","#005eff"]],
    4:["#fff8e7","#d9d9d9","#e9c7b9","#cc0000","#6b1f2b",["#fff8e7","#d9d9d9"],["#e9c7b9","#cc0000"],["#6b1f2b","#6b1f2b"]],
    5:["#808080","#ffb6c1","#001f5c","#005eff","#2e8b57","#4f7942","#d4af37","#ffffff","#8b5a2b","#ff1493","#ffc0cb","#00ffff","#f5deb3","#3a3a3a","#4b2e2e","#d8bfd8","#9370db","#228b22","#000000","#d7263d","#87ceeb","#7a5c58","#556b2f","#6b8e23","#1b2a49","#d3d3d3",["#808080","#ffb6c1"],["#001f5c","#005eff"],["#2e8b57","#4f7942"],["#808080","#d4af37"],["#ffffff","#8b5a2b"],["#ffffff","#808080"],["#005eff","#808080"],["#ff1493","#ffc0cb"],["#00ffff","#808080"],["#8b5a2b","#f5deb3"],["#3a3a3a","#808080"],["#ffc0cb","#ffffff"],["#4b2e2e","#ffffff"],["#d8bfd8","#9370db"],["#005eff","#8b5a2b"],["#228b22","#ffffff"],["#ffb6c1","#ff1493"],["#000000","#808080"],["#8b5a2b","#f5deb3"],["#8b5a2b","#f0e6c8"],["#005eff","#f5deb3"],["#d7263d","#ffffff"],["#005eff","#87ceeb"],["#7a5c58","#808080"],["#001f5c","#ffffff"],["#556b2f","#6b8e23"],["#1b2a49","#d3d3d3"]]
};

function cantidadProductos(categoria){
    if(categoria==="sabanas") return 5;
    if(categoria==="mantas") return 4;
    if(categoria==="peluches") return 31;
    if(categoria==="acolchados") return 0;
    if(categoria==="cobertores") return 2;
    if(categoria==="toallas") return 2;
    return 0;
}

/* ========================= */
/* GENERAR SECCIONES */
/* ========================= */
let htmlGenerado = "";

categorias.forEach(categoria => {
    // Estructurar Grillas principales
    htmlGenerado += `
    <section class="pagina" id="${categoria}">
        <h2 class="titulo">
            ${categoria==="peluches" ? "Peluches con manta" : categoria.charAt(0).toUpperCase() + categoria.slice(1)}
        </h2>
        <div class="grid">
            ${Array.from({length:cantidadProductos(categoria)}, (_,i)=>`
                <div class="producto" onclick="mostrarPagina('${categoria}${i+1}')">
                    <img src="${categoria}_modelo${i+1}.png">
                    <div class="info">
                        <h3>${categoria==="sabanas" ? nombresSabanas[i+1] : categoria + " Modelo " + (i+1)}</h3>
                    </div>
                </div>
            `).join("")}
        </div>
    </section>
    `;

    // Estructurar Detalle interno de cada producto
    for(let i=0; i<cantidadProductos(categoria); i++){
        const nombreProductoActual = categoria==="sabanas" ? nombresSabanas[i+1] : categoria + " Modelo " + (i+1);
        
        htmlGenerado += `
        <section class="pagina" id="${categoria}${i+1}">
            <div style="width:100%; overflow:hidden; margin-bottom:20px;">
                <div class="btn-volver" onclick="mostrarPagina('${categoria}')">← Volver</div>
            </div>
            <div class="producto-container">
                <div class="galeria">
                    <div class="imagen-principal">
                        <img id="img-principal-${categoria}${i+1}" src="${categoria}_modelo${i+1}.png">
                    </div>
                </div>
                <div class="producto-info">
                    <h1>${nombreProductoActual}</h1>
                    <div class="descripcion">
                        Producto premium de Aderet. Diseño elegante, moderno y minimalista. Ideal para darle confort y estilo a tu hogar.
                    </div>
                    ${categoria==="sabanas" ? `
                        <div class="subtitulo">Talles</div>
                        <div class="talles">
                            ${tallesSabanas[i+1].map(talle => `
                                <div class="talle" onclick="seleccionarTalle(this, '${nombresSabanas[i+1]}', '${talle.nombre}', '${talle.precio}')">
                                    ${talle.nombre} · $${talle.precio}
                                </div>
                            `).join("")}
                        </div>
                        <div class="subtitulo">Colores</div>
                        <div class="colores">
                            ${coloresSabanas[i+1].map((color, idx) => {
                                if(Array.isArray(color)){
                                    return `<div class="color" onclick="seleccionarColor(this); cambiarImagenColor('${categoria}${i+1}', '${categoria}_modelo${i+1}_${idx+1}.png')" style="background:linear-gradient(90deg, ${color[0]} 50%, ${color[1]} 50%);"></div>`;
                                }else{
                                    return `<div class="color" onclick="seleccionarColor(this); cambiarImagenColor('${categoria}${i+1}', '${categoria}_modelo${i+1}_${idx+1}.png')" style="background:${color}"></div>`;
                                }
                            }).join("")}
                        </div>
                    ` : ""}
                    <a class="btn btn-consultar-wa" href="https://wa.me/5491158203956?text=${encodeURIComponent('Hola, quería consultar sobre: ' + nombreProductoActual)}" target="_blank">
                        Consultar
                    </a>
                </div>
            </div>
        </section>
        `;
    }
});

// Inyección limpia sin romper nodos previos del DOM
document.getElementById("contenedorPrincipal").insertAdjacentHTML('beforeend', htmlGenerado);

/* ========================= */
/* LOGICA DE INTERACCIÓN */
/* ========================= */
function mostrarPagina(id){
    const paginas = document.querySelectorAll(".pagina");
    paginas.forEach(function(pagina){
        pagina.style.display = "none";
        pagina.classList.remove("activa");
    });

    const paginaActiva = document.getElementById(id);
    if(paginaActiva){
        if(id === "inicio"){
            paginaActiva.style.display = "flex";
            paginaActiva.classList.add("activa");
        } else {
            paginaActiva.style.display = "block";
        }
    }
    
    if(window.innerWidth <= 900){
        document.querySelector(".sidebar").classList.remove("activo");
    }
}

function toggleProductos(){
    const submenu = document.getElementById("submenuProductos");
    if(submenu.style.display === "block"){
        submenu.style.display = "none";
    } else {
        submenu.style.display = "block";
    }
}

function toggleMenu(){
    document.querySelector(".sidebar").classList.toggle("activo");
}

function seleccionarColor(elemento){
    const contenedor = elemento.parentElement;
    contenedor.querySelectorAll(".color").forEach(color => {
        color.classList.remove("activo");
    });
    elemento.classList.add("activo");
}

function seleccionarTalle(elemento, nombreProducto, talleNombre, tallePrecio){
    const contenedor = elemento.parentElement;
    contenedor.querySelectorAll(".talle").forEach(talle => {
        talle.classList.remove("activo");
    });
    elemento.classList.add("activo");

    const botonWa = elemento.closest('.producto-info').querySelector('.btn-consultar-wa');
    if(botonWa){
        botonWa.href = 'https://wa.me/5491158203956?text=' + encodeURIComponent('Hola, quería consultar sobre la ' + nombreProducto + ' talle ' + talleNombre + ' de $' + tallePrecio);
    }
}

function cambiarImagenColor(idPagina, nuevaRuta) {
    const img = document.getElementById("img-principal-" + idPagina);
    if(img) {
        img.src = nuevaRuta;
    }
}
</script>

</body>
</html>
